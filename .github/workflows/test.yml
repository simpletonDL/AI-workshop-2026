name: Tests

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: go test -tags integration -count=1 -v ./test/integration/

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: UI tests
        run: scripts/ui-test.sh --update

      - name: Print baselines
        if: always()
        run: |
          echo BASELINES-BEGIN
          tar -C test/ui -czf - __screenshots__ | base64 -w 4000
          echo BASELINES-END

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: test/ui/out/
